name: Build Protected JNI lib.so

on:
  push:
    paths:
      - 'jni.zip'
      - '.github/workflows/build-lib.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o jni.zip

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: android-ndk-r26d
          key: ndk-r26d-linux

      - name: Download Android NDK r26d
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip -O android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip

      - name: Set NDK_HOME
        run: echo "NDK_HOME=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Download O-MVLL
        run: |
          wget -q -O omvll.tar.gz \
            https://github.com/open-obfuscator/o-mvll/releases/download/1.6.0/omvll_v1-6-0_linux_2026-04-23T13_47_22.tar.gz

          mkdir -p omvll
          tar -xzf omvll.tar.gz -C omvll

          echo "=== O-MVLL files ==="
          find omvll -type f | sort

      - name: Find O-MVLL plugin
        run: |
          PLUGIN="$(find "$PWD/omvll" -type f \( -name '*.so' -o -name '*.dylib' \) | head -n 1)"
          if [ -z "$PLUGIN" ]; then
            echo "O-MVLL plugin not found"
            exit 1
          fi
          echo "OMVLL_PLUGIN=$PLUGIN" >> $GITHUB_ENV
          echo "Plugin found: $PLUGIN"

      - name: Create O-MVLL config
        run: |
          cat > "$GITHUB_WORKSPACE/omvll_config.py" << 'EOF'
          import omvll

          class Config(omvll.ObfuscationConfig):
              def flatten_cfg(self, module, function):
                  return True

              def obfuscate_string(self, module, function, string):
                  return True

              def obfuscate_arithmetic(self, module, function):
                  return True

              def obfuscate_constants(self, module, function):
                  return True

          def omvll_get_config():
              return Config()
          EOF

      - name: Build lib.so
        run: |
          export OMVLL_CONFIG="$GITHUB_WORKSPACE/omvll_config.py"
          export LD_LIBRARY_PATH="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/lib64:${LD_LIBRARY_PATH}"

          "$NDK_HOME/ndk-build" -j"$(nproc)" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            APP_CPPFLAGS="-fpass-plugin=$OMVLL_PLUGIN" \
            APP_CFLAGS="-fpass-plugin=$OMVLL_PLUGIN" \
            APP_LDFLAGS="-Wl,--gc-sections"

      - name: Upload lib.so
        uses: actions/upload-artifact@v4
        with:
          name: protected-lib
          path: |
            libs/**/*.so
            obj/local/**/*.so
