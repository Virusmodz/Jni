name: Build Protected JNI lib.so

on:
  push:
    paths:
      - 'jni.zip'
      - '.github/workflows/build-lib.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Unzip project
        run: |
          unzip -o jni.zip
          echo "=== Project files ==="
          find . -maxdepth 4 -type f | sort

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v5
        with:
          path: android-ndk-r26d
          key: ndk-r26d-linux

      - name: Download Android NDK r26d
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget -q -O android-ndk-r26d-linux.zip \
            https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip

      - name: Set NDK_HOME
        run: echo "NDK_HOME=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Download O-MVLL
        run: |
          wget -q -O omvll.tar.gz \
            https://github.com/open-obfuscator/o-mvll/releases/download/1.6.0/omvll_v1-6-0_linux_2026-04-23T13_47_22.tar.gz

          mkdir -p omvll
          tar -xzf omvll.tar.gz -C omvll

          echo "=== O-MVLL files ==="
          find omvll -type f | sort

      - name: Find O-MVLL plugin
        run: |
          PLUGIN="$(find "$PWD/omvll" -type f \( -name '*.so' -o -name '*.dylib' \) | head -n 1)"
          if [ -z "$PLUGIN" ]; then
            echo "O-MVLL plugin not found"
            exit 1
          fi
          echo "OMVLL_PLUGIN=$PLUGIN" >> $GITHUB_ENV
          echo "Plugin found: $PLUGIN"

      - name: Set O-MVLL Python path and runtime env
        run: |
          # Prefer the layout shown in your log: omvll/Python-3.10.7/Lib
          PY_LIB_FILE="$(find "$PWD/omvll" -type f -path '*/Lib/encodings/__init__.py' | head -n 1)"
          if [ -n "$PY_LIB_FILE" ]; then
            PY_LIB_DIR="$(dirname "$(dirname "$PY_LIB_FILE")")"
            echo "OMVLL_PYTHONPATH=$PY_LIB_DIR" >> $GITHUB_ENV
            echo "Using OMVLL_PYTHONPATH=$PY_LIB_DIR"
          else
            # Fallback for package layouts that use cpython-install
            CPY_FILE="$(find "$PWD/omvll" -type f -path '*/lib/python3.10/encodings/__init__.py' | head -n 1)"
            if [ -n "$CPY_FILE" ]; then
              CPY_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$CPY_FILE")")")")"
              echo "OMVLL_PYTHONPATH=$CPY_ROOT/lib/python310.zip:$CPY_ROOT/lib/python3.10:$CPY_ROOT/lib/lib-dynload" >> $GITHUB_ENV
              echo "Using fallback OMVLL_PYTHONPATH from $CPY_ROOT"
            else
              echo "Could not find Python stdlib inside O-MVLL package"
              find omvll -maxdepth 4 -type f | sort | tail -n 200
              exit 1
            fi
          fi

          echo "OMVLL_CONFIG=$GITHUB_WORKSPACE/omvll_config.py" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/lib64:${LD_LIBRARY_PATH}" >> $GITHUB_ENV

      - name: Create O-MVLL config
        run: |
          cat > "$GITHUB_WORKSPACE/omvll_config.py" << 'EOF'
          import omvll
          from functools import lru_cache

          class Config(omvll.ObfuscationConfig):
              def __init__(self):
                  super().__init__()

              def flatten_cfg(self, module, function):
                  return True

              def obfuscate_string(self, module, function, string):
                  return True

              def obfuscate_arithmetic(self, module, function):
                  return True

              def obfuscate_constants(self, module, function):
                  return True

          @lru_cache(maxsize=1)
          def omvll_get_config():
              return Config()
          EOF

      - name: Check BoxView header
        run: |
          if [ ! -f "jni/BoxView.hpp" ]; then
            FOUND="$(find . -name 'BoxView.hpp' | head -n 1)"
            if [ -n "$FOUND" ]; then
              cp -f "$FOUND" jni/BoxView.hpp
              echo "Copied $FOUND to jni/BoxView.hpp"
            else
              echo "BoxView.hpp is still missing"
              echo "You need to add it to jni/ or fix the include path in Android.mk"
            fi
          fi

      - name: Build lib.so
        run: |
          "$NDK_HOME/ndk-build" -j"$(nproc)" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            APP_CPPFLAGS="-fpass-plugin=$OMVLL_PLUGIN" \
            APP_CFLAGS="-fpass-plugin=$OMVLL_PLUGIN" \
            APP_LDFLAGS="-Wl,--gc-sections"

      - name: Upload lib.so
        uses: actions/upload-artifact@v6
        with:
          name: protected-lib
          path: |
            libs/**/*.so
            obj/local/**/*.so
